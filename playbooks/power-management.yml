---
- name: Configure power management
  hosts: homelab
  become: yes
  vars:
    debug: false
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:

    - name: Detect CPU
      ansible.builtin.command: lscpu
      register: cpu_info
      changed_when: false

    - name: Display CPU info
      ansible.builtin.debug:
        msg: "CPU detected: {{ cpu_info.stdout }}"

  roles:
    - role: power-saving
      tags: ['power', 'cpu', 'apm']

  post_tasks:
    - name: Verify CPU governor
      ansible.builtin.command: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
      register: governor_check
      changed_when: false

    - name: Display CPU governor status
      ansible.builtin.debug:
        msg: "Current CPU governor: {{ governor_check.stdout }}"
